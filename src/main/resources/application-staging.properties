# ===========================================
# Staging Profile - Ambiente Docker STAGING
# Servidor: 100.84.196.79 puerto 9180/9182
# DB schema: padilla_staging
# ===========================================

ssh.tunnel.enabled=false

# PostgreSQL via red Docker interna
spring.datasource.url=jdbc:postgresql://padilla-postgres:5432/padilla-db?currentSchema=padilla_staging
spring.datasource.username=padilla
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - staging NO modifica schema automaticamente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.padilla=INFO
logging.level.root=WARN

app.environment=staging

# Email — Resend (variable de entorno en Docker)
app.frontend-url=http://100.84.196.79:9182

