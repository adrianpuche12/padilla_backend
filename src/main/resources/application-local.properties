# ===========================================
# Local Profile - Maquina del desarrollador
# Usa SSH tunnel para conectar a la DB del servidor
# Requiere Tailscale activo con jorgepuche02@gmail.com
# ===========================================

# SSH Tunnel a servidor Nilo
ssh.tunnel.enabled=true
ssh.tunnel.host=100.84.196.79
ssh.tunnel.port=22
ssh.tunnel.user=nilo
ssh.tunnel.local-port=5433
ssh.tunnel.remote-host=localhost
ssh.tunnel.remote-port=5433

# PostgreSQL via SSH Tunnel
spring.datasource.url=jdbc:postgresql://localhost:5433/padilla-db?currentSchema=padilla_dev
spring.datasource.username=padilla
spring.datasource.password=${DB_PASSWORD:padilla_db_2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - en local puede actualizar schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection Pool (liviano para local)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Logging verbose para desarrollo
logging.level.org.springframework.security=DEBUG
logging.level.com.padilla=DEBUG

# Keycloak - apunta al puerto correcto en Nilo
keycloak.auth-server-url=http://62.171.160.238:8095
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://62.171.160.238:8095/realms/padilla
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://62.171.160.238:8095/realms/padilla/protocol/openid-connect/certs
keycloak.admin.server-url=http://62.171.160.238:8095
