# ===========================================
# Dev Profile - Ambiente Docker DEV
# Servidor: 100.84.196.79 puerto 9280/9282
# DB schema: padilla_dev
# ===========================================

ssh.tunnel.enabled=false

# PostgreSQL via red Docker interna
spring.datasource.url=jdbc:postgresql://padilla-postgres:5432/padilla-db?currentSchema=padilla_dev
spring.datasource.username=padilla
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - dev puede actualizar schema automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.padilla=DEBUG
logging.level.root=INFO

app.environment=dev
