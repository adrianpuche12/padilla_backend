# ===========================================
# Dev Profile - Ambiente Docker DEV
# Servidor: 100.84.196.79 puerto 9280/9282
# DB schema: padilla_dev
# ===========================================

ssh.tunnel.enabled=false

# PostgreSQL via red Docker interna
spring.datasource.url=jdbc:postgresql://padilla-postgres:5432/padilla-db?currentSchema=padilla_dev
spring.datasource.username=${DB_APP_USERNAME:padilla}
spring.datasource.password=${DB_APP_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# PRO-002: schema de la base principal para este ambiente (JPA, JDBC y Flyway)
app.db.schema=padilla_dev
spring.flyway.enabled=true

# JPA - PRO-002: el schema lo administra Flyway (PRO-003); Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.padilla=DEBUG
logging.level.root=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://propero.nilosolutions.com,http://100.84.196.79:9282,http://localhost:5173}
# PRO-020: Padilla es la agencia de los usuarios existentes
app.default-agency-id=${DEFAULT_AGENCY_ID:00000000-0000-0000-0000-000000000001}
app.environment=dev

# Email — Resend (variable de entorno en Docker)
app.frontend-url=http://100.84.196.79:9282

# ===========================================
# Legacy Datasource (n8n DB - 158.220.103.12)
# En dev: conexion directa desde Nilo a 158.220.103.12
# ===========================================
legacy.datasource.url=jdbc:postgresql://158.220.103.12:5432/padilla-db?currentSchema=padilla
legacy.datasource.username=padilla
legacy.datasource.password=${LEGACY_DATASOURCE_PASSWORD}
legacy.datasource.driver-class-name=org.postgresql.Driver
legacy.db.schema=${LEGACY_DB_SCHEMA:padilla}
