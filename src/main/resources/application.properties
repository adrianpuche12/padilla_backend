# Application
spring.application.name=padilla-backend

# Server
server.port=8080

# Actuator - Expose health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Custom base path for actuator (optional - makes /health available at /actuator/health)
# To access: http://localhost:8080/actuator/health

# ===========================================
# OAuth2 Resource Server - Keycloak
# ===========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://62.171.160.238:8095/realms/padilla
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://62.171.160.238:8095/realms/padilla/protocol/openid-connect/certs

# ===========================================
# Logging (opcional - para debug)
# ===========================================
logging.level.org.springframework.security=INFO

# ===========================================
# Keycloak Auth Service Configuration
# ===========================================
keycloak.auth-server-url=http://62.171.160.238:8095
keycloak.realm=padilla
keycloak.client-id=padilla_frontend
