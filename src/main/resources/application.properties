# Application
spring.application.name=padilla-backend

# PRO-007: origenes permitidos por CORS (coma). Cada ambiente lo define; CORS_ALLOWED_ORIGINS lo pisa.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Server
server.port=8080

# Actuator - Expose health endpoint
management.endpoints.web.exposure.include=health,info
# PRO-007: health publico sin detalles (antes mostraba el estado de las bases)
management.endpoint.health.show-details=never

# Custom base path for actuator (optional - makes /health available at /actuator/health)
# To access: http://localhost:8080/actuator/health

# ===========================================
# OAuth2 Resource Server - Keycloak
# ===========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://100.84.196.79:8080}/realms/${KEYCLOAK_REALM:padilla}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://100.84.196.79:8080}/realms/${KEYCLOAK_REALM:padilla}/protocol/openid-connect/certs

# ===========================================
# Logging (opcional - para debug)
# ===========================================
logging.level.org.springframework.security=INFO

# ===========================================
# Keycloak Auth Service Configuration
# ===========================================
keycloak.auth-server-url=${KEYCLOAK_URL:http://100.84.196.79:8080}
keycloak.realm=padilla
keycloak.client-id=padilla_frontend

# ===========================================
# Keycloak Admin API Configuration
# ===========================================
keycloak.admin.server-url=${KEYCLOAK_URL:http://100.84.196.79:8080}
keycloak.admin.realm=padilla
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:}

# ===========================================
# PostgreSQL Database Configuration
# ===========================================
# En desarrollo usamos SSH tunnel (puerto local 5433)
# En produccion usamos conexion directa via red Docker
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# PRO-002: schema por ambiente. Cada profile lo define; DB_SCHEMA / LEGACY_DB_SCHEMA lo pisan.
app.db.schema=${DB_SCHEMA:public}
legacy.db.schema=${LEGACY_DB_SCHEMA:padilla}

# ===========================================
# Email — Resend
# ===========================================
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:Propero <onboarding@resend.dev>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===========================================
# OpenAI — DNI reading (Reservas module)
# ===========================================
openai.api-key=${OPENAI_API_KEY:}

# ===========================================
# Flyway (PRO-003)
# ===========================================
# Apagado por defecto. Se habilita por profile (dev, local, test).
# staging y prod: apagado hasta conciliar sus schemas con V12 (requiere OK de Jorge).
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${app.db.schema}
spring.flyway.default-schema=${app.db.schema}
spring.flyway.create-schemas=true
# Schemas existentes sin historial (padilla_dev) arrancan en 12 = scripts manuales V3..V12 ya aplicados.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=12
spring.flyway.baseline-description=scripts manuales V3..V12

# ===========================================
# Multi-inmobiliaria (PRO-020 / PRO-021)
# ===========================================
# Agencia para usuarios que solo existen en Keycloak (provision JIT). Vacio = sin agencia (403).
app.default-agency-id=${DEFAULT_AGENCY_ID:}
# Flyway migra con el dueno de las tablas; la app se conecta con propero_app (sin superusuario,
# para que RLS aplique). Ver docs/MULTI-INMOBILIARIA.md.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_MIGRATION_USERNAME:padilla}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
