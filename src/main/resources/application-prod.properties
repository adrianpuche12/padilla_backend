# ===========================================
# Prod Profile - Ambiente Docker PRODUCCION
# Servidor: 100.84.196.79 puerto 9080/9082
# DB schema: padilla
# ===========================================

ssh.tunnel.enabled=false

# PostgreSQL via red Docker interna
spring.datasource.url=jdbc:postgresql://padilla-postgres:5432/padilla-db?currentSchema=padilla
spring.datasource.username=${DB_APP_USERNAME:padilla}
spring.datasource.password=${DB_APP_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# PRO-002: schema de la base principal para este ambiente (JPA, JDBC y Flyway)
app.db.schema=padilla

# JPA - prod NUNCA modifica schema automaticamente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Connection Pool (mas grande para prod)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging minimo en prod
logging.level.org.springframework.security=WARN
logging.level.com.padilla=WARN
logging.level.root=ERROR

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://100.84.196.79:9082}
# PRO-020: Padilla es la agencia de los usuarios existentes
app.default-agency-id=${DEFAULT_AGENCY_ID:00000000-0000-0000-0000-000000000001}
app.environment=prod

# Email — Resend (variable de entorno en Docker)
app.frontend-url=http://100.84.196.79:9082

# ===========================================
# Legacy Datasource (n8n DB - 158.220.103.12)
# ===========================================
legacy.datasource.url=jdbc:postgresql://158.220.103.12:5432/padilla-db?currentSchema=padilla
legacy.datasource.username=padilla
legacy.datasource.password=${LEGACY_DATASOURCE_PASSWORD}
legacy.datasource.driver-class-name=org.postgresql.Driver
legacy.db.schema=${LEGACY_DB_SCHEMA:padilla}
