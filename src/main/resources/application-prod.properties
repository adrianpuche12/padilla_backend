ssh.tunnel.enabled=false

# PostgreSQL via red Docker interna
spring.datasource.url=jdbc:postgresql://padilla-postgres:5432/padilla-db?currentSchema=padilla
spring.datasource.username=padilla
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - prod NUNCA modifica schema automaticamente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Connection Pool (mas grande para prod)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging minimo en prod
logging.level.org.springframework.security=WARN
logging.level.com.padilla=WARN
logging.level.root=ERROR

app.environment=prod

# Email — Resend (variable de entorno en Docker)
app.frontend-url=http://100.84.196.79:9082

