# ===========================================
# Test Profile (PRO-004)
# Base: Postgres 17 en Testcontainers (ver support/AbstractIntegrationTest).
# La URL, usuario y password los inyecta @DynamicPropertySource.
# ===========================================
ssh.tunnel.enabled=false
app.db.schema=propero_test
spring.flyway.enabled=true
# validate: si una entidad no coincide con las migraciones, el contexto no levanta
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

legacy.db.schema=legacy_test

app.environment=test
app.frontend-url=http://localhost:5173

# Keycloak: no se contacta en los tests (JWT simulados con spring-security-test)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:65535/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:65535/realms/test/protocol/openid-connect/certs
keycloak.auth-server-url=http://localhost:65535
keycloak.admin.server-url=http://localhost:65535
keycloak.admin.password=test

# PRO-021: usuarios solo-Keycloak de los tests caen en la agencia Padilla (creada por V16)
app.default-agency-id=00000000-0000-0000-0000-000000000001

# PRO-046: adjuntos de los tests en una carpeta temporal
app.storage.path=${java.io.tmpdir}/propero-test-files
