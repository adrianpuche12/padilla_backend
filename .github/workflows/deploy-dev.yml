name: Deploy — DEV

# PRO-001 (2026-10-27): el deploy automatico queda manual. No hay runner self-hosted
# registrado para estos repos y Propero dev se construye en el servidor Nilo con
# scripts/deploy-dev.sh (ver PRO-009). Se puede volver a 'push: dev' cuando haya runner.
on:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/adrianpuche-padilla-backend

jobs:
  deploy-dev:
    runs-on: [self-hosted, padilla-backend]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen :dev
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}

      - name: Deploy servicio DEV
        run: |
          docker pull ${{ env.IMAGE }}:dev

          if docker service ls | grep -q padilla-backend-dev; then
            docker service update \
              --force \
              --image ${{ env.IMAGE }}:dev \
              --with-registry-auth \
              padilla-backend-dev
          else
            docker service create \
              --name padilla-backend-dev \
              --network padilla-network-dev \
              --publish 9280:8080 \
              --env SPRING_PROFILES_ACTIVE=dev \
              --env DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              --env KEYCLOAK_URL=${{ secrets.KEYCLOAK_URL }} \
              --with-registry-auth \
              ${{ env.IMAGE }}:dev
          fi

          echo "Deploy completado — servicio convergido"
