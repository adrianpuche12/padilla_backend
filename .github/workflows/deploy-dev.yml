name: Deploy — DEV

on:
  push:
    branches:
      - dev

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/adrianpuche-padilla-backend

jobs:
  deploy-dev:
    runs-on: [self-hosted, padilla-backend]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen :dev
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}

      - name: Deploy servicio DEV
        run: |
          docker pull ${{ env.IMAGE }}:dev

          if docker service ls | grep -q padilla-backend-dev; then
            docker service update \
              --image ${{ env.IMAGE }}:dev \
              --with-registry-auth \
              padilla-backend-dev
          else
            docker service create \
              --name padilla-backend-dev \
              --network padilla-network-dev \
              --publish 9280:8080 \
              --env SPRING_PROFILES_ACTIVE=dev \
              --env DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              --env KEYCLOAK_URL=${{ secrets.KEYCLOAK_URL }} \
              --with-registry-auth \
              ${{ env.IMAGE }}:dev
          fi

          echo "Deploy completado — servicio convergido"
