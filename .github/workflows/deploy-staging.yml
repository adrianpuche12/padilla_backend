name: Deploy — STAGING

on:
  push:
    branches:
      - staging

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/adrianpuche-padilla-backend

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagen dev -> staging (sin rebuild)
        run: |
          docker pull ${{ env.IMAGE }}:dev
          docker tag ${{ env.IMAGE }}:dev ${{ env.IMAGE }}:staging
          docker tag ${{ env.IMAGE }}:dev ${{ env.IMAGE }}:staging-${{ github.sha }}
          docker push ${{ env.IMAGE }}:staging
          docker push ${{ env.IMAGE }}:staging-${{ github.sha }}

      - name: Deploy en servidor STAGING
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:staging

            if docker service ls | grep -q padilla-backend-staging; then
              docker service update \
                --image ${{ env.IMAGE }}:staging \
                --with-registry-auth \
                padilla-backend-staging
            else
              docker service create \
                --name padilla-backend-staging \
                --network padilla-network-staging \
                --publish 9180:8080 \
                --env SPRING_PROFILES_ACTIVE=staging \
                --env DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                --env KEYCLOAK_URL=${{ secrets.KEYCLOAK_URL }} \
                --with-registry-auth \
                ${{ env.IMAGE }}:staging
            fi

            sleep 20
            curl -sf http://localhost:9180/actuator/health || echo "Health check pendiente"
