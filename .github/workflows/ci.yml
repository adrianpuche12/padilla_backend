name: CI — Build & Test

on:
  push:
    branches-ignore:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build y test
        run: ./mvnw clean verify -B

      - name: Verificar Dockerfile
        run: docker build --no-cache -t padilla-backend:ci-test .
